[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cycleie"
version = "1.0.0"
description = "Robust document information extraction through iterative verification and refinement"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/zzhang393/CycleIE"

[tool.setuptools.packages.find]
include = ["cycleie*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
